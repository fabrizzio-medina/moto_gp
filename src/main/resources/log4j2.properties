status = WARN
name = MotoGPConfig

# --- Consola ---
appender.console.type = Console
appender.console.name = Consola
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{dd/MM/yyyy HH:mm:ss.SSS} %-5level %logger{1} - %msg%n
appender.console.filter.threshold.type = ThresholdFilter
appender.console.filter.threshold.level = INFO

# --- Evidencia: un fichero por ejecución con fecha y hora en el nombre ---
appender.evidencia.type = File
appender.evidencia.name = Evidencia
appender.evidencia.fileName = logs/evidencias/ejecucion_${date:dd-MM-yyyy_HH-mm-ss}.log
appender.evidencia.layout.type = PatternLayout
appender.evidencia.layout.pattern = %d{dd/MM/yyyy HH:mm:ss.SSS} %-5level %logger{1} - %msg%n%throwable
appender.evidencia.filter.threshold.type = ThresholdFilter
appender.evidencia.filter.threshold.level = INFO

# --- Runtime: rotación por tamaño (10 KB), comprimido .gz, máximo 5 históricos ---
appender.runtime.type = RollingFile
appender.runtime.name = Runtime
appender.runtime.fileName = logs/runtime/aplicacion.log
appender.runtime.filePattern = logs/runtime/aplicacion-%d{yyyy-MM-dd}-%i.log.gz
appender.runtime.layout.type = PatternLayout
appender.runtime.layout.pattern = %d{dd/MM/yyyy HH:mm:ss.SSS} %-5level %logger{1} - %msg%n%throwable
appender.runtime.policies.type = Policies
appender.runtime.policies.size.type = SizeBasedTriggeringPolicy
appender.runtime.policies.size.size = 10KB
appender.runtime.strategy.type = DefaultRolloverStrategy
appender.runtime.strategy.max = 5

# --- Logger de la aplicación ---
logger.motogp.name = com.motogp
logger.motogp.level = DEBUG
logger.motogp.additivity = false
logger.motogp.appenderRef.consola.ref = Consola
logger.motogp.appenderRef.evidencia.ref = Evidencia
logger.motogp.appenderRef.runtime.ref = Runtime

rootLogger.level = WARN
rootLogger.appenderRef.consola.ref = Consola

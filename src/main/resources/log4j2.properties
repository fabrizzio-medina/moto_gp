status = WARN
name = PropertiesConfig

# --- APPENDER (Consola) ---
appender.console.type = Console
appender.console.name = out
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%-5level] %logger{36} - %msg%n


# --- APPENDER DE ARCHIVO (Disco)
appender.file.type = File
appender.file.name = FileAppender
appender.file.fileName = logs/evidencias/ejecucion_${date:dd-MM-yyyy_HH-mm-ss}.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%-5level] %logger{36} - %msg%n

# --- LOGGER ESPECÍFICO (Tus clases muestran hasta DEBUG/TRACE) ---
logger.simulator.name = com.example.simulator
logger.simulator.level = DEBUG
logger.simulator.additivity = false
logger.simulator.appenderRefs = ConsoleRef, FileRef
logger.simulator.appenderRef.ConsoleRef.ref = out
logger.simulator.appenderRef.FileRef.ref = FileAppender


# --- LOGGER RAÍZ (Root) ---
rootLogger.level = INFO
rootLogger.appenderRefs = ConsoleRef, FileRef
rootLogger.appenderRef.ConsoleRef.ref = out
rootLogger.appenderRef.FileRef.ref = FileAppender